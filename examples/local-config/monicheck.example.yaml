version: 1

connectors:
  - type: prometheus
    name: production-metrics
    url: https://prometheus.example.com
    # Optional when Grafana stores a different internal URL for this source.
    # The config must contain exactly one Grafana connector when this is set.
    prometheus_datasource_uid: prom-main
    auth:
      bearer_token_env: PROMETHEUS_TOKEN
    tls:
      ca_file: /etc/monicheck/ca.pem
      timeout: 20s

  - type: grafana
    name: shared-grafana
    url: https://grafana.example.com
    namespace: production
    # Optional: exclude only dashboards explicitly tied to another datasource.
    # Variable and unresolved datasource dashboards remain in scope as UNKNOWN.
    datasource_filter_uid: prom-main
    auth:
      api_key_env: GRAFANA_API_KEY

  - type: otelcol
    name: gateway
    path: /etc/otelcol/config.yaml
    health_url: http://127.0.0.1:13133
    metrics_url: http://127.0.0.1:8888/metrics

  - type: loki
    name: logs
    url: https://loki.example.com
    tenant_id: tenant-a
    auth:
      bearer_token_env: LOKI_TOKEN

  - type: kubernetes
    name: platform-manifests
    path: ./manifests

# Optional governance policy. Scope can be ALL_SERVICES, SERVICE, NAMESPACE,
# or LABEL_SELECTOR with a single key=value selector.
coverage_expectations:
  - id: production-service-baseline
    name: Production service baseline
    scope: LABEL_SELECTOR
    scope_value: environment=production
    required_signals: [metrics, dashboards, alerts]
    owner: sre-platform
    rationale: Production services require tri-signal operational coverage.

# Exceptions are explicit and time bounded. Copy a starter entry from the
# Local UI Coverage view, then review owner, reason, and expiry before use.
coverage_exceptions:
  - expectation_id: production-service-baseline
    service_id: CHANGE_ME
    signal: alerts
    owner: CHANGE_ME
    reason: CHANGE_ME
    created_by: CHANGE_ME
    expires_at: 2099-01-01T00:00:00Z
